# Cleanup workflow trigger revision 2
name: Clean migrated reality-data content

on:
  push:
    branches: [agent/video-skill-scoring-plan]
    paths:
      - .github/workflows/cleanup-reality-data.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out game branch
        uses: actions/checkout@v4
        with:
          ref: agent/video-skill-scoring-plan
          fetch-depth: 0

      - name: Check out validated data-lab destination
        uses: actions/checkout@v4
        with:
          repository: yunfannas/idol-data-lab
          ref: agent/initial-extraction
          path: _data_lab

      - name: Remove only destination-verified migrated files
        shell: bash
        run: |
          set -euo pipefail
          test -s _data_lab/migration/game-reality-files.txt
          test -s _data_lab/migration/game-package-scripts.txt
          test -s _data_lab/migration/summary.json

          python - <<'PY'
          from pathlib import Path
          import json

          data_lab = Path('_data_lab')
          manifest = [line.strip() for line in (data_lab / 'migration/game-reality-files.txt').read_text(encoding='utf-8').splitlines() if line.strip()]
          protected = {
              '.cursor/skills/game-logic-balance/SKILL.md',
              '.cursor/skills/scenario-db-integrity/SKILL.md',
              '.cursor/skills/scenario-db-integrity/reference.md',
              'support/scripts/checkMainScenarioDbIntegrity.mjs',
          }
          destination_missing = []
          removed = []
          for rel in manifest:
              if rel in protected:
                  continue
              destination = data_lab / 'legacy/game' / rel
              if not destination.is_file():
                  destination_missing.append(rel)
                  continue
              source = Path(rel)
              if source.is_file() or source.is_symlink():
                  source.unlink()
                  removed.append(rel)
          if destination_missing:
              raise SystemExit('Cleanup aborted because destination copies are missing:\n' + '\n'.join(destination_missing))

          for root in (Path('support'), Path('.cursor/skills')):
              if root.exists():
                  dirs = sorted((p for p in root.rglob('*') if p.is_dir()), key=lambda p: len(p.parts), reverse=True)
                  for directory in dirs:
                      try:
                          directory.rmdir()
                      except OSError:
                          pass

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          script_keys = {line.strip() for line in (data_lab / 'migration/game-package-scripts.txt').read_text(encoding='utf-8').splitlines() if line.strip()}
          scripts = package.setdefault('scripts', {})
          for key in sorted(script_keys):
              scripts.pop(key, None)
          package.setdefault('devDependencies', {}).pop('tesseract.js', None)
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          boundary = Path('support/docs/data-lab-boundary.md')
          boundary.parent.mkdir(parents=True, exist_ok=True)
          boundary.write_text(
              '# Data Lab Boundary\n\nReal-world research, scraping, source verification, schedule and venue collection, media analysis, temporary evidence, and database curation tools live in `yunfannas/idol-data-lab`.\n\nThis repository retains runtime game logic and UI, saves and scenarios, balanced runtime data, Choreographic-compatible game-facing editors and players, integrity checks, and reviewed import boundaries.\n',
              encoding='utf-8',
          )
          summary = {
              'removedFileCount': len(removed),
              'protectedFalsePositives': sorted(protected),
              'removedPackageScripts': sorted(script_keys),
              'dataLabManifest': json.loads((data_lab / 'migration/summary.json').read_text(encoding='utf-8')),
          }
          Path('support/reality-data-cleanup-summary.json').write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary, indent=2))
          PY
          rm -rf _data_lab

      - name: Refresh dependencies and validate game
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run build
          npm run typecheck

      - name: Verify repository boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -d support/scripts/video_skill_scoring
          test ! -d support/data/video-skill-benchmark
          test ! -d support/reports/video-skill-scoring
          test ! -d support/tmp
          test -f .cursor/skills/game-logic-balance/SKILL.md
          test -f .cursor/skills/scenario-db-integrity/SKILL.md
          test -f support/scripts/checkMainScenarioDbIntegrity.mjs
          ! grep -q 'tesseract.js' package.json
          ! grep -q 'calendar:timetree' package.json

      - name: Commit cleanup
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit'
            exit 0
          fi
          git commit -m 'Move reality-data tooling to idol-data-lab'
          git push origin HEAD:agent/video-skill-scoring-plan
